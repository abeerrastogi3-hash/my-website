<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Notes App</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-sidebar: #161922;
            --bg-card: #1e222f;
            --bg-card-hover: #262b3c;
            --border-color: #2e3648;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR (Saved Notes Tabs) --- */
        aside {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-new-note {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .btn-new-note:hover {
            background-color: var(--accent-hover);
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* The clickable tabs for saved notes */
        .note-tab {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .note-tab:hover {
            background-color: var(--bg-card-hover);
            border-color: var(--accent-color);
        }

        .note-tab.active {
            border-color: var(--accent-color);
            background-color: var(--bg-card-hover);
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .note-tab-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-tab-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- MAIN EDITOR AREA --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-main);
        }

        .editor-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
        }

        .input-title {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            padding: 14px 18px;
            border-radius: 8px;
            outline: none;
            width: 100%;
        }

        .input-title:focus {
            border-color: var(--accent-color);
        }

        .input-body {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1rem;
            padding: 18px;
            border-radius: 8px;
            outline: none;
            width: 100%;
            min-height: 250px;
            resize: vertical;
            line-height: 1.5;
        }

        .input-body:focus {
            border-color: var(--accent-color);
        }

        /* Image attachment options */
        .image-upload-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-upload-label {
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .file-upload-label:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        #image-input {
            display: none;
        }

        .image-preview-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: fit-content;
        }

        .image-preview-container img {
            max-height: 80px;
            border-radius: 4px;
        }

        .btn-remove-image {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-remove-image:hover {
            background: #dc2626;
        }

        /* Bottom Action Bar */
        .editor-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn-save {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background-color: #059669;
        }

        .btn-delete {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Sidebar holding the saved note tabs -->
    <aside>
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-book"></i> My Notes</h2>
            <button class="btn-new-note" id="new-btn"><i class="fa-solid fa-plus"></i> New</button>
        </div>
        <div class="notes-list" id="notes-list-container">
            <!-- Saved note tabs will dynamically appear here -->
        </div>
    </aside>

    <!-- Main Write / Edit Area -->
    <main>
        <div class="editor-container">
            <input type="text" id="note-title" class="input-title" placeholder="Note Title...">
            <textarea id="note-body" class="input-body" placeholder="Write your note content here..."></textarea>
            
            <div class="image-upload-section">
                <label class="file-upload-label" for="image-input">
                    <i class="fa-solid fa-image"></i> Click to attach an image to this note
                </label>
                <input type="file" id="image-input" accept="image/*">

                <div id="image-preview-wrapper" class="image-preview-container hidden">
                    <img id="image-preview" src="" alt="Attached Preview">
                    <button class="btn-remove-image" id="remove-img-btn">Remove Image</button>
                </div>
            </div>

            <div class="editor-actions">
                <button class="btn-delete" id="delete-btn"><i class="fa-solid fa-trash"></i> Delete Note</button>
                <button class="btn-save" id="save-btn"><i class="fa-solid fa-floppy-disk"></i> Save Note</button>
            </div>
        </div>
    </main>

    <script>
        // Array to store notes. We load them from browser storage if available!
        let notes = JSON.parse(localStorage.getItem('my_saved_notes')) || [
            {
                id: 1,
                title: "Welcome Note 👋",
                body: "Welcome to your note-taking app! You can write titles, contents, attach images, and click 'Save Note' to save them as tabs on the left sidebar.",
                image: null
            }
        ];

        let activeNoteId = notes.length > 0 ? notes[0].id : null;
        let currentImageBase64 = null;

        // HTML Elements
        const notesListContainer = document.getElementById('notes-list-container');
        const titleInput = document.getElementById('note-title');
        const bodyInput = document.getElementById('note-body');
        const imageInput = document.getElementById('image-input');
        const imagePreviewWrapper = document.getElementById('image-preview-wrapper');
        const imagePreview = document.getElementById('image-preview');
        const saveBtn = document.getElementById('save-btn');
        const newBtn = document.getElementById('new-btn');
        const deleteBtn = document.getElementById('delete-btn');
        const removeImgBtn = document.getElementById('remove-img-btn');

        // Render the sidebar list of tabs
        function renderSidebar() {
            notesListContainer.innerHTML = '';
            
            if (notes.length === 0) {
                notesListContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem; text-align:center; margin-top:20px;">No saved notes yet.</p>';
                return;
            }

            notes.forEach(note => {
                const tab = document.createElement('div');
                tab.className = `note-tab ${note.id === activeNoteId ? 'active' : ''}`;
                tab.innerHTML = `
                    <div class="note-tab-title">${escapeHTML(note.title || "Untitled Note")}</div>
                    <div class="note-tab-preview">${escapeHTML(note.body || "No additional text...")}</div>
                `;
                
                // Clicking a tab loads that note into the editor
                tab.addEventListener('click', () => {
                    activeNoteId = note.id;
                    loadActiveNoteToEditor();
                    renderSidebar();
                });

                notesListContainer.appendChild(tab);
            });
        }

        // Load the currently active note into the input fields
        function loadActiveNoteToEditor() {
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                titleInput.value = note.title;
                bodyInput.value = note.body;
                currentImageBase64 = note.image || null;
                
                if (currentImageBase64) {
                    imagePreview.src = currentImageBase64;
                    imagePreviewWrapper.classList.remove('hidden');
                } else {
                    imagePreview.src = '';
                    imagePreviewWrapper.classList.add('hidden');
                }
            }
        }

        // Save button action: updates or creates the tab
        saveBtn.addEventListener('click', () => {
            if (!activeNoteId) {
                // If somehow no note is active, create a new one
                createANewNote();
            }

            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.title = titleInput.value.trim() || "Untitled Note";
                note.body = bodyInput.value;
                note.image = currentImageBase64;

                saveToLocalStorage();
                renderSidebar();
                alert("Note saved successfully!");
            }
        });

        // Handle Image upload and convert to text/base64 format so it saves inside local storage
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    currentImageBase64 = uploadEvent.target.result;
                    imagePreview.src = currentImageBase64;
                    imagePreviewWrapper.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Remove image button
        removeImgBtn.addEventListener('click', () => {
            currentImageBase64 = null;
            imagePreview.src = '';
            imagePreviewWrapper.classList.add('hidden');
            imageInput.value = '';
        });

        // Create New Note button
        function createANewNote() {
            const newId = Date.now(); // unique timestamp ID
            const newNote = {
                id: newId,
                title: "New Note",
                body: "",
                image: null
            };
            notes.unshift(newNote);
            activeNoteId = newId;
            saveToLocalStorage();
            loadActiveNoteToEditor();
            renderSidebar();
        }

        newBtn.addEventListener('click', createANewNote);

        // Delete Note button
        deleteBtn.addEventListener('click', () => {
            if (notes.length === 0) return;
            
            if (confirm("Are you sure you want to delete this note?")) {
                notes = notes.filter(n => n.id !== activeNoteId);
                saveToLocalStorage();

                if (notes.length > 0) {
                    activeNoteId = notes[0].id;
                    loadActiveNoteToEditor();
                } else {
                    activeNoteId = null;
                    titleInput.value = "";
                    bodyInput.value = "";
                    currentImageBase64 = null;
                    imagePreviewWrapper.classList.add('hidden');
                }
                renderSidebar();
            }
        });

        // Save data to browser LocalStorage so notes stay even if you refresh or close browser
        function saveToLocalStorage() {
            localStorage.setItem('my_saved_notes', JSON.stringify(notes));
        }

        // Security escape function
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initialize App on load
        if (notes.length > 0) {
            loadActiveNoteToEditor();
        }
        renderSidebar();
    </script>
</body>
</html>
